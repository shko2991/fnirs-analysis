СИСТЕМЫ</text><circle cx="510.79434377149335" cy="443.82033294520204" r="7" fill="#F5B83D" opacity="1" stroke="none" stroke-width="1"/><text x="500.79434377149335" y="448.82033294520204" font-family="Arial" font-size="13" font-weight="500" fill="#14213D" text-anchor="end" opacity="1" letter-spacing="0">робототехника</text><circle cx="827.0" cy="560.0" r="7" fill="#F5B83D" opacity="1" stroke="none" stroke-width="1"/><text x="837.0" y="565.0" font-family="Arial" font-size="13" font-weight="500" fill="#14213D" text-anchor="start" opacity="1" letter-spacing="0">автономный транспорт</text><circle cx="510.79434377149335" cy="676.179667054798" r="7" fill="#F5B83D" opacity="1" stroke="none" stroke-width="1"/><text x="500.79434377149335" y="681.179667054798" font-family="Arial" font-size="13" font-weight="500" fill="#14213D" text-anchor="end" opacity="1" letter-spacing="0">удалённый мониторинг</text><circle cx="985" cy="545" r="161" fill="#21C4D6" opacity="0.1" stroke="none" stroke-width="1"/><circle cx="985" cy="545" r="145" fill="#21C4D6" opacity="0.92" stroke="none" stroke-width="1"/><text x="985" y="530" font-family="Arial" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle" opacity="1" letter-spacing="0">ЯЗЫК, РЕЧЬ</text><text x="985" y="560" font-family="Arial" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle" opacity="1" letter-spacing="0">И МУЛЬТИМОДАЛЬНОСТЬ</text><circle cx="847.1073751937871" cy="425.4430170424463" r="7" fill="#21C4D6" opacity="1" stroke="none" stroke-width="1"/><text x="837.1073751937871" y="430.4430170424463" font-family="Arial" font-size="13" font-weight="500" fill="#14213D" text-anchor="end" opacity="1" letter-spacing="0">генеративные модели</text><circle cx="1172.0" cy="545.0" r="7" fill="#21C4D6" opacity="1" stroke="none" stroke-width="1"/><text x="1182.0" y="550.0" font-family="Arial" font-size="13" font-weight="500" fill="#14213D" text-anchor="start" opacity="1" letter-spacing="0">перевод и поиск</text><circle cx="847.1073751937871" cy="664.5569829575537" r="7" fill="#21C4D6" opacity="1" stroke="none" stroke-width="1"/><text x="837.1073751937871" y="669.5569829575537" font-family="Arial" font-size="13" font-weight="500" fill="#14213D" text-anchor="end" opacity="1" letter-spacing="0">распознавание речи</text><circle cx="1290" cy="390" r="132" fill="#E05178" opacity="0.1" stroke="none" stroke-width="1"/><circle cx="1290" cy="390" r="116" fill="#E05178" opacity="0.92" stroke="none" stroke-width="1"/><text x="1290" y="390" font-family="Arial" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle" opacity="1" letter-spacing="0">ДОВЕРЕННЫЙ ИИ</text><circle cx="1173.4917929444832" cy="290.03144927842965" r="7" fill="#E05178" opacity="1" stroke="none" stroke-width="1"/><text x="1163.4917929444832" y="295.03144927842965" font-family="Arial" font-size="13" font-weight="500" fill="#14213D" text-anchor="end" opacity="1" letter-spacing="0">безопасность</text><circle cx="1448.0" cy="390.0" r="7" fill="#E05178" opacity="1" stroke="none" stroke-width="1"/><text x="1458.0" y="395.0" font-family="Arial" font-size="13" font-weight="500" fill="#14213D" text-anchor="start" opacity="1" letter-spacing="0">объяснимость</text><circle cx="1173.4917929444832" cy="489.96855072157035" r="7" fill="#E05178" opacity="1" stroke="none" stroke-width="1"/><text x="1163.4917929444832" y="494.96855072157035" font-family="Arial" font-size="13" font-weight="500" fill="#14213D" text-anchor="end" opacity="1" letter-spacing="0">контроль рисков</text><rect x="70" y="720" width="1110" height="104" rx="16" fill="#F4F7FC" stroke="#DCE5F5" stroke-width="1" opacity="1"/><text x="95" y="752" font-family="Arial" font-size="14" font-weight="700" fill="#3366FF" text-anchor="start" opacity="1" letter-spacing="1">КАК ЧИТАТЬ ЛАНДШАФТ</text><text x="95" y="785.0" font-family="Arial" font-size="17" font-weight="400" fill="#14213D" text-anchor="start" opacity="1" letter-spacing="0">Размер узла = значимость темы • расстояние = смысловая близость • цвет = кластер.</text><text x="95" y="806.25" font-family="Arial" font-size="17" font-weight="400" fill="#14213D" text-anchor="start" opacity="1" letter-spacing="0">Авторская укрупненная реконструкция исходной карты; названия кластеров переведены на язык управленческих решений.</text><rect x="1200" y="720" width="320" height="104" rx="16" fill="#0B1736" stroke="none" stroke-width="0" opacity="1"/><text x="1225" y="754" font-family="Arial" font-size="14" font-weight="700" fill="#21C4D6" text-anchor="start" opacity="1" letter-spacing="1">ИНСАЙТ</text><text x="1225" y="786.0" font-family="Arial" font-size="17" font-weight="600" fill="#FFFFFF" text-anchor="start" opacity="1" letter-spacing="0">Конкурируют уже не модели,</text><text x="1225" y="806.4" font-family="Arial" font-size="17" font-weight="600" fill="#FFFFFF" text-anchor="start" opacity="1" letter-spacing="0">а связки</text><text x="1225" y="826.8" font-family="Arial" font-size="17" font-weight="600" fill="#FFFFFF" text-anchor="start" opacity="1" letter-spacing="0">«данные–агент–действие».</text><line x1="80" y1="850" x2="1520" y2="850" stroke="#D9E1F2" stroke-width="1" opacity="1" stroke-dasharray=""/><text x="80" y="878" font-family="Arial" font-size="14" font-weight="400" fill="#667085" text-anchor="start" opacity="1" letter-spacing="0">Аналитика автора на основе семантической карты iFORA; источники — в справке</text><text x="1520" y="878" font-family="Arial" font-size="14" font-weight="700" fill="#667085" text-anchor="end" opacity="1" letter-spacing="0">02</text></svg>