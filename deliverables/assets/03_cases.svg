<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="100%" height="100%" fill="#FFFFFF"/><text x="72" y="68" font-family="Arial" font-size="35" font-weight="700" fill="#0B1736" text-anchor="start" opacity="1" letter-spacing="0">Два сигнала 2026: ИИ выходит в физический мир — под контролем</text><text x="72" y="105" font-family="Arial" font-size="20" font-weight="400" fill="#667085" text-anchor="start" opacity="1" letter-spacing="0">Масштабирование упирается одновременно в вычислительную инфраструктуру и доказуемую надежность.</text><rect x="72" y="150" width="708" height="600" rx="22" fill="#FFFFFF" stroke="#D8E2F2" stroke-width="2" opacity="1"/><rect x="72" y="150" width="708" height="12" rx="6" fill="#3366FF" stroke="none" stroke-width="0" opacity="1"/><text x="106" y="205" font-family="Arial" font-size="20" font-weight="700" fill="#3366FF" text-anchor="start" opacity="1" letter-spacing="0">01</text><text x="162" y="205" font-family="Arial" font-size="17" font-weight="700" fill="#3366FF" text-anchor="start" opacity="1" letter-spacing="1">ФИЗИЧЕСКИЙ ИИ</text><rect x="820" y="150" width="708" height="600" rx="22" fill="#FFFFFF" stroke="#D8E2F2" stroke-width="2" opacity="1"/><rect x="820" y="150" width="708" height="12" rx="6" fill="#E05178" stroke="none" stroke-width="0" opacity="1"/><text x="854" y="205" font-family="Arial" font-size="20" font-weight="700" fill="#E05178" text-anchor="start" opacity="1" letter-spacing="0">02</text><text x="910" y="205" font-family="Arial" font-size="17" font-weight="700" fill="#E05178" text-anchor="start" opacity="1" letter-spacing="1">ДОВЕРЕННЫЙ ИИ</text><text x="106" y="265.0" font-family="Arial" font-size="34" font-weight="700" fill="#0B1736" text-anchor="start" opacity="1" letter-spacing="0">Роботы и автономные</text><text x="106" y="304.1" font-family="Arial" font-size="34" font-weight="700" fill="#0B1736" text-anchor="start" opacity="1" letter-spacing="0">системы становятся</text><text x="106" y="343.2" font-family="Arial" font-size="34" font-weight="700" fill="#0B1736" text-anchor="start" opacity="1" letter-spacing="0">новым интерфейсом ИИ</text><rect x="106" y="415" width="640" height="126" rx="15" fill="#F4F7FC" stroke="none" stroke-width="0" opacity="1"/><text x="130" y="450" font-family="Arial" font-size="14" font-weight="700" fill="#3366FF" text-anchor="start" opacity="1" letter-spacing="1">ПОКАЗАТЕЛЬНЫЙ КЕЙС</text><text x="130" y="485.0" font-family="Arial" font-size="18" font-weight="500" fill="#14213D" text-anchor="start" opacity="1" letter-spacing="0">NVIDIA и General Motors создают AI-модели,</text><text x="130" y="507.5" font-family="Arial" font-size="18" font-weight="500" fill="#14213D" text-anchor="start" opacity="1" letter-spacing="0">симуляции и вычислительные контуры для производства</text><text x="130" y="530.0" font-family="Arial" font-size="18" font-weight="500" fill="#14213D" text-anchor="start" opacity="1" letter-spacing="0">и транспорта — от цифрового двойника до автомобиля.</text><text x="106" y="595" font-family="Arial" font-size="14" font-weight="700" fill="#667085" text-anchor="start" opacity="1" letter-spacing="1">УПРАВЛЕНЧЕСКИЙ ВЫВОД</text><text x="106" y="630.0" font-family="Arial" font-size="20" font-weight="600" fill="#14213D" text-anchor="start" opacity="1" letter-spacing="0">Инвестиционный фокус: данные реального мира,</text><text x="106" y="655.0" font-family="Arial" font-size="20" font-weight="600" fill="#14213D" text-anchor="start" opacity="1" letter-spacing="0">симуляция, edge-вычисления и безопасность контура.</text><text x="106" y="714" font-family="Arial" font-size="13" font-weight="400" fill="#667085" text-anchor="start" opacity="1" letter-spacing="0">Источник: NVIDIA, 18.03.2025 (доступ: 13.08.2026)</text><text x="854" y="265.0" font-family="Arial" font-size="34" font-weight="700" fill="#0B1736" text-anchor="start" opacity="1" letter-spacing="0">Регулирование становится</text><text x="854" y="304.1" font-family="Arial" font-size="34" font-weight="700" fill="#0B1736" text-anchor="start" opacity="1" letter-spacing="0">частью архитектуры</text><text x="854" y="343.2" font-family="Arial" font-size="34" font-weight="700" fill="#0B1736" text-anchor="start" opacity="1" letter-spacing="0">продукта — не «комплаенсом»</text><rect x="854" y="415" width="640" height="126" rx="15" fill="#FFF4F6" stroke="none" stroke-width="0" opacity="1"/><text x="878" y="450" font-family="Arial" font-size="14" font-weight="700" fill="#E05178" text-anchor="start" opacity="1" letter-spacing="1">ПОКАЗАТЕЛЬНЫЙ КЕЙС</text><text x="878" y="485.0" font-family="Arial" font-size="18" font-weight="500" fill="#14213D" text-anchor="start" opacity="1" letter-spacing="0">С 2 августа 2026 г. применяются ключевые правила</text><text x="878" y="507.5" font-family="Arial" font-size="18" font-weight="500" fill="#14213D" text-anchor="start" opacity="1" letter-spacing="0">EU AI Act для high-risk систем; поставщикам нужны</text><text x="878" y="530.0" font-family="Arial" font-size="18" font-weight="500" fill="#14213D" text-anchor="start" opacity="1" letter-spacing="0">управление рисками, документация и human oversight.</text><text x="854" y="595" font-family="Arial" font-size="14" font-weight="700" fill="#667085" text-anchor="start" opacity="1" letter-spacing="1">УПРАВЛЕНЧЕСКИЙ ВЫВОД</text><text x="854" y="630.0" font-family="Arial" font-size="20" font-weight="600" fill="#14213D" text-anchor="start" opacity="1" letter-spacing="0">Доверие превращается в продуктовую функцию:</text><text x="854" y="655.0" font-family="Arial" font-size="20" font-weight="600" fill="#14213D" text-anchor="start" opacity="1" letter-spacing="0">traceability, оценка качества и контроль человека.</text><text x="854" y="714" font-family="Arial" font-size="13" font-weight="400" fill="#667085" text-anchor="start" opacity="1" letter-spacing="0">Источник: European Commission, AI Act (доступ: 13.08.2026)</text><line x1="80" y1="850" x2="1520" y2="850" stroke="#D9E1F2" stroke-width="1" opacity="1" stroke-dasharray=""/><text x="80" y="878" font-family="Arial" font-size="14" font-weight="400" fill="#667085" text-anchor="start" opacity="1" letter-spacing="0">Аналитика автора на основе семантической карты iFORA; источники — в справке</text><text x="1520" y="878" font-family="Arial" font-size="14" font-weight="700" fill="#667085" text-anchor="end" opacity="1" letter-spacing="0">03</text></svg>