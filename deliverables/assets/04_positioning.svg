<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="100%" height="100%" fill="#FFFFFF"/><text x="72" y="68" font-family="Arial" font-size="35" font-weight="700" fill="#0B1736" text-anchor="start" opacity="1" letter-spacing="0">iFORA: единый радар решений для государства, бизнеса и науки</text><text x="72" y="105" font-family="Arial" font-size="20" font-weight="400" fill="#667085" text-anchor="start" opacity="1" letter-spacing="0">Позиционирование: не «поисковик по документам», а доказательная система раннего обнаружения возможностей и рисков.</text><rect x="72" y="160" width="448" height="500" rx="20" fill="#FFFFFF" stroke="#D9E2F2" stroke-width="2" opacity="1"/><rect x="72" y="160" width="448" height="82" rx="20" fill="#3366FF" stroke="none" stroke-width="0" opacity="1"/><text x="100" y="211" font-family="Arial" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="start" opacity="1" letter-spacing="0">ОРГАНЫ ВЛАСТИ</text><text x="102" y="290" font-family="Arial" font-size="13" font-weight="700" fill="#3366FF" text-anchor="start" opacity="1" letter-spacing="1">БОЛЬ</text><text x="102" y="327.0" font-family="Arial" font-size="20" font-weight="600" fill="#14213D" text-anchor="start" opacity="1" letter-spacing="0">Сигналы разрознены;</text><text x="102" y="352.0" font-family="Arial" font-size="20" font-weight="600" fill="#14213D" text-anchor="start" opacity="1" letter-spacing="0">решения запаздывают</text><text x="102" y="418" font-family="Arial" font-size="13" font-weight="700" fill="#3366FF" text-anchor="start" opacity="1" letter-spacing="1">ЗАДАЧА</text><text x="102" y="455.0" font-family="Arial" font-size="20" font-weight="600" fill="#14213D" text-anchor="start" opacity="1" letter-spacing="0">Мониторинг технологий,</text><text x="102" y="480.0" font-family="Arial" font-size="20" font-weight="600" fill="#14213D" text-anchor="start" opacity="1" letter-spacing="0">рынков и регуляторных рисков</text><text x="102" y="546" font-family="Arial" font-size="13" font-weight="700" fill="#3366FF" text-anchor="start" opacity="1" letter-spacing="1">ЦЕННОСТЬ</text><text x="102" y="583.0" font-family="Arial" font-size="20" font-weight="600" fill="#14213D" text-anchor="start" opacity="1" letter-spacing="0">Обоснованные приоритеты</text><text x="102" y="608.0" font-family="Arial" font-size="20" font-weight="600" fill="#14213D" text-anchor="start" opacity="1" letter-spacing="0">и измеримый foresight</text><rect x="568" y="160" width="448" height="500" rx="20" fill="#FFFFFF" stroke="#D9E2F2" stroke-width="2" opacity="1"/><rect x="568" y="160" width="448" height="82" rx="20" fill="#8257E5" stroke="none" stroke-width="0" opacity="1"/><text x="596" y="211" font-family="Arial" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="start" opacity="1" letter-spacing="0">БИЗНЕС</text><text x="598" y="290" font-family="Arial" font-size="13" font-weight="700" fill="#8257E5" text-anchor="start" opacity="1" letter-spacing="1">БОЛЬ</text><text x="598" y="327.0" font-family="Arial" font-size="20" font-weight="600" fill="#14213D" text-anchor="start" opacity="1" letter-spacing="0">Сложно отличить тренд</text><text x="598" y="352.0" font-family="Arial" font-size="20" font-weight="600" fill="#14213D" text-anchor="start" opacity="1" letter-spacing="0">от информационного шума</text><text x="598" y="418" font-family="Arial" font-size="13" font-weight="700" fill="#8257E5" text-anchor="start" opacity="1" letter-spacing="1">ЗАДАЧА</text><text x="598" y="455.0" font-family="Arial" font-size="20" font-weight="600" fill="#14213D" text-anchor="start" opacity="1" letter-spacing="0">Скаутинг технологий,</text><text x="598" y="480.0" font-family="Arial" font-size="20" font-weight="600" fill="#14213D" text-anchor="start" opacity="1" letter-spacing="0">конкурентов и партнеров</text><text x="598" y="546" font-family="Arial" font-size="13" font-weight="700" fill="#8257E5" text-anchor="start" opacity="1" letter-spacing="1">ЦЕННОСТЬ</text><text x="598" y="583.0" font-family="Arial" font-size="20" font-weight="600" fill="#14213D" text-anchor="start" opacity="1" letter-spacing="0">Быстрее гипотеза →</text><text x="598" y="608.0" font-family="Arial" font-size="20" font-weight="600" fill="#14213D" text-anchor="start" opacity="1" letter-spacing="0">пилот → инвестиция</text><rect x="1064" y="160" width="448" height="500" rx="20" fill="#FFFFFF" stroke="#D9E2F2" stroke-width="2" opacity="1"/><rect x="1064" y="160" width="448" height="82" rx="20" fill="#2E9E7A" stroke="none" stroke-width="0" opacity="1"/><text x="1092" y="211" font-family="Arial" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="start" opacity="1" letter-spacing="0">НАУКА</text><text x="1094" y="290" font-family="Arial" font-size="13" font-weight="700" fill="#2E9E7A" text-anchor="start" opacity="1" letter-spacing="1">БОЛЬ</text><text x="1094" y="327.0" font-family="Arial" font-size="20" font-weight="600" fill="#14213D" text-anchor="start" opacity="1" letter-spacing="0">Невидимы смежные фронтиры</text><text x="1094" y="352.0" font-family="Arial" font-size="20" font-weight="600" fill="#14213D" text-anchor="start" opacity="1" letter-spacing="0">и окна кооперации</text><text x="1094" y="418" font-family="Arial" font-size="13" font-weight="700" fill="#2E9E7A" text-anchor="start" opacity="1" letter-spacing="1">ЗАДАЧА</text><text x="1094" y="455.0" font-family="Arial" font-size="20" font-weight="600" fill="#14213D" text-anchor="start" opacity="1" letter-spacing="0">Картирование фронтиров,</text><text x="1094" y="480.0" font-family="Arial" font-size="20" font-weight="600" fill="#14213D" text-anchor="start" opacity="1" letter-spacing="0">команд и патентных ниш</text><text x="1094" y="546" font-family="Arial" font-size="13" font-weight="700" fill="#2E9E7A" text-anchor="start" opacity="1" letter-spacing="1">ЦЕННОСТЬ</text><text x="1094" y="583.0" font-family="Arial" font-size="20" font-weight="600" fill="#14213D" text-anchor="start" opacity="1" letter-spacing="0">Сильнее повестка, заявки</text><text x="1094" y="608.0" font-family="Arial" font-size="20" font-weight="600" fill="#14213D" text-anchor="start" opacity="1" letter-spacing="0">и междисциплинарные связи</text><rect x="72" y="700" width="1440" height="114" rx="18" fill="#0B1736" stroke="none" stroke-width="0" opacity="1"/><text x="100" y="738" font-family="Arial" font-size="14" font-weight="700" fill="#21C4D6" text-anchor="start" opacity="1" letter-spacing="1">ОБЩЕЕ ОБЕЩАНИЕ</text><text x="100" y="778.0" font-family="Arial" font-size="25" font-weight="700" fill="#FFFFFF" text-anchor="start" opacity="1" letter-spacing="0">iFORA превращает миллионы документов в общую картину — и делает следующий стратегический шаг</text><text x="100" y="808.0" font-family="Arial" font-size="25" font-weight="700" fill="#FFFFFF" text-anchor="start" opacity="1" letter-spacing="0">проверяемым.</text><line x1="80" y1="850" x2="1520" y2="850" stroke="#D9E1F2" stroke-width="1" opacity="1" stroke-dasharray=""/><text x="80" y="878" font-family="Arial" font-size="14" font-weight="400" fill="#667085" text-anchor="start" opacity="1" letter-spacing="0">Источник позиционирования: открытые материалы ИСИЭЗ НИУ ВШЭ; синтез автора</text><text x="1520" y="878" font-family="Arial" font-size="14" font-weight="700" fill="#667085" text-anchor="end" opacity="1" letter-spacing="0">04</text></svg>